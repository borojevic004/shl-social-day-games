<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Finde mit dem Sozialer Tag Matchmaker passende Jobs zu deinen Interessen." />
  <title>ST-Mobil - Sozialer Tag Matchmaker</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/portrait.css" media="(orientation: portrait)" />
  <link rel="stylesheet" href="css/landscape.css" media="(orientation: landscape)" />
  <link rel="stylesheet" href="css/home.css" />
</head>
<body class="home-active">
  <div class="confetti-container" id="confettiContainer" aria-hidden="true"></div>

  <div class="modal-backdrop" id="job-modal" aria-hidden="true">
    <div class="modal" id="job-modal-content" role="dialog" aria-modal="true" aria-labelledby="job-modal-title"></div>
  </div>

  <div class="app">
    <section class="home-screen screen-active" id="screen-home">
      <div class="home-decoration" aria-hidden="true">
        <img class="home-decor home-decor-globe" src="assets/home/globe.png" alt="" />
        <img class="home-decor home-decor-location" src="assets/home/location.png" alt="" />
        <img class="home-decor home-decor-calendar" src="assets/home/calendar.png" alt="" />
        <img class="home-decor home-decor-heart" src="assets/home/heart.png" alt="" />
        <img class="home-decor home-decor-sun" src="assets/home/sun.png" alt="" />
        <img class="home-decor home-decor-megaphone" src="assets/home/megaphone.png" alt="" />
        <img class="home-decor home-decor-shl" src="assets/home/shl.png" alt="" />
        <img class="home-arrow" src="assets/home/arrow.png" alt="" />
      </div>

      <div class="home-content">
        <div class="home-domain">sozialertag.de</div>

        <div class="home-claim">
          <h1><span>1 Tag.</span><span>1 Job.</span><span>1 Ziel.</span></h1>
          <p>Dein Interaktiver Guide<br />zum Sozialen Tag</p>
        </div>

        <div class="home-menu" aria-label="Spielauswahl">
          <button class="home-menu-card home-menu-matchmaker" id="start-matchmaker" type="button">
            <span class="home-menu-icon" aria-hidden="true">
              <svg viewBox="0 0 64 64">
                <path d="m32 7 7.3 14.8 16.3 2.4-11.8 11.5 2.8 16.2L32 44.2l-14.6 7.7 2.8-16.2L8.4 24.2l16.3-2.4L32 7Z" />
                <path d="M27 26.5 32 23l5 3.5M32 23v13M27.5 34.5 32 37l4.5-2.5" />
              </svg>
            </span>
            <span class="home-menu-copy">
              <strong>Matchmaker</strong>
              <small>Welcher Job passt zu dir?</small>
            </span>
          </button>

          <button class="home-menu-card home-menu-swiper" type="button" aria-disabled="true">
            <span class="home-menu-icon" aria-hidden="true">
              <svg viewBox="0 0 64 64">
                <rect x="19" y="7" width="27" height="50" rx="5" />
                <path d="M27 12h11M29 51h7M12 25c4-4 8-4 12 0M11 34c5-4 9-4 13 0" />
              </svg>
            </span>
            <span class="home-menu-copy">
              <strong>Job Swiper</strong>
              <small>Swipe Job-Ideen</small>
            </span>
          </button>

          <button class="home-menu-card home-menu-runner" type="button" aria-disabled="true">
            <span class="home-menu-icon" aria-hidden="true">
              <svg viewBox="0 0 64 64">
                <circle cx="39" cy="10" r="5" />
                <path d="m34 20-9 8 8 7 6-10 10 7M33 35l-8 15-12 4M35 35l10 7 7 12M24 27l-9-2" />
              </svg>
            </span>
            <span class="home-menu-copy">
              <strong>Runner</strong>
              <small>Demnächst verfügbar</small>
            </span>
          </button>
        </div>
      </div>
    </section>

    <section class="matchmaker-screen" id="screen-matchmaker" aria-hidden="true">
      <button class="matchmaker-back-btn" id="back-home" type="button" aria-label="Zurück zum Hauptmenü">
        <span class="matchmaker-back-arrow" aria-hidden="true">←</span>
        <span class="matchmaker-back-label">Zurück</span>
      </button>

      <header class="header">
        <div class="badge">SOZIALER TAG 2026</div>
        <br> <br>
        <h1>Dein Sozialer Tag Mobil</h1>
        <p id="subtitle">Swipe deine Interessen und finde heraus, welcher Top Job zu dir passt!</p>
        <br>
      </header>

      <section id="screen-interests" aria-labelledby="screen-title">
        <h2 class="screen-title" id="screen-title">ST Matchmaker</h2>
        <p class="screen-sub" id="screen-sub">Swipe oder wähle unten, was zu dir passt.</p>
        <br> <br>

        <div class="card-container">
          <div
            id="match-card"
            class="card card-pop"
            role="group"
            aria-label="Interessenkarte"
            tabindex="0"
          ></div>
        </div>

        <br> <br>

        <div class="choice-panel">
          <p class="hint" id="hint" aria-live="polite"></p>

          <div class="buttons" id="controls">
            <button class="btn btn-no" id="btnNo" type="button"><span class="btn-emoji">👎</span> Eher nicht</button>
            <button class="btn btn-yes" id="btnYes" type="button"><span class="btn-emoji">👍</span> Passt zu mir</button>
          </div>

          <p class="progress" id="progress" aria-live="polite"></p>
        </div>
      </section>
    </section>
  </div>

  <script src="data/interests.js"></script>
  <script src="data/jobs.js"></script>
  <script src="data/attributeLabels.js"></script>
  <script src="js/app.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/matching.js"></script>
  <script src="js/swiping.js"></script>
  <script src="js/matchmaker.js"></script>
</body>
</html>
