<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ST-Mobil - Sozialer Tag Matchmaker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="confetti-container" id="confettiContainer"></div>

  <div class="modal-backdrop" id="job-modal" aria-hidden="true">
    <div class="modal" id="job-modal-content" role="dialog" aria-modal="true" aria-labelledby="job-modal-title"></div>
  </div>

  <div class="app">
    <section class="home-screen screen-active" id="screen-home">
      <div class="brand-mark">SHL</div>
      <h1>Schüler*innen Helfen Leben</h1>
      <div class="mach-st-box">Mach ST</div>
      <button class="home-start-btn" id="start-matchmaker" type="button">Matchmaker starten</button>
    </section>

    <section class="matchmaker-screen" id="screen-matchmaker" aria-hidden="true">
      <header class="header">
        <div class="badge">SOZIALER TAG 2026</div>
        <h1>Dein Sozialer Tag Mobil</h1>
        <p id="subtitle">Swipe deine Interessen und finde heraus, welcher Top Job zu dir passt!</p>
      </header>

      <section id="screen-interests">
        <div class="screen-title" id="screen-title">ST Matchmaker</div>
        <div class="screen-sub" id="screen-sub">Swipe oder wähle unten, was zu dir passt.</div>

        <div class="card-container">
          <div id="match-card" class="card card-pop"></div>
        </div>

        <p class="hint" id="hint"></p>

        <div class="buttons" id="controls">
          <button class="btn btn-no" id="btnNo" type="button"><span class="btn-emoji">👎</span> Eher nicht</button>
          <button class="btn btn-yes" id="btnYes" type="button"><span class="btn-emoji">👍</span> Passt zu mir</button>
        </div>

        <p class="progress" id="progress"></p>
      </section>
    </section>
  </div>

  <script src="data/interests.js"></script>
  <script src="data/jobs.js"></script>
  <script src="data/jobAttributes.js"></script>
  <script src="data/attributeLabels.js"></script>
  <script src="js/app.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/swiping.js"></script>
  <script src="js/matchmaker.js"></script>
</body>
</html>
